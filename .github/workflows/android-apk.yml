name: Build Android APK

# Manual: Actions tab -> "Build Android APK" -> Run workflow.
# Produces an installable release APK (signed with the debug keystore — fine for
# sideloading onto test tablets, NOT for the Play Store) as a build artifact.
#
# android/ is gitignored, so the native project is regenerated from app.json
# with `expo prebuild` on every run — the same source of truth for everyone.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend API base URL baked into the app (must be https)
        default: https://auriva-api.centralindia.cloudapp.azure.com/api
        required: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # React Native 0.81 builds with JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      # arm64-v8a + armeabi-v7a covers real Android tablets and phones; skipping
      # the x86 emulator ABIs roughly halves build time and APK size.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify the backend URL is baked into the bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          HOST=$(echo "$EXPO_PUBLIC_API_BASE_URL" | sed -E 's#https?://([^/:]+).*#\1#')
          unzip -p "$APK" assets/index.android.bundle | grep -a -q "$HOST" \
            || { echo "::error::$HOST not found in the JS bundle"; exit 1; }
          echo "Bundle points at $HOST"
          mv "$APK" "auriva-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: auriva-apk-${{ github.sha }}
          path: auriva-*.apk
          retention-days: 14
